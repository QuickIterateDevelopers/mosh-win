[package]
name = "mosh-win"
version = "0.1.0"
edition = "2024"
description = "Native Windows client for mosh, the mobile shell"
# Ported from mosh (https://mosh.org), which is GPLv3+.
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["mosh", "ssh", "terminal", "windows"]
categories = ["command-line-utilities", "network-programming"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
aes = "0.8"
anyhow = "1"
base64 = "0.22"
flate2 = "1"
ocb3 = "0.1"
prost = "0.13"
rand = "0.8"
unicode-width = "0.2"
vte = "0.13"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO"] }
